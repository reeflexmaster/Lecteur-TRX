<style>
:root{--c:#00f0ff;--m:#ff2bd6;--g:#b6ff00;--bg:#000;--tx:#f4fbff;--mut:#6f8a96;--line:#10242b;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#000;color:var(--tx);font-family:-apple-system,system-ui,"Segoe UI",sans-serif}
body{min-height:100vh;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
header{padding:18px 18px 6px}
h1{margin:0 0 14px;font-size:26px;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:var(--c);text-shadow:0 0 8px var(--c),0 0 24px var(--c)}
h1 i{font-style:normal;color:var(--m);text-shadow:0 0 8px var(--m),0 0 24px var(--m)}
.row{display:flex;gap:10px}
.nb{flex:1;background:#000;color:var(--c);border:1.5px solid var(--c);border-radius:14px;padding:12px;font:700 14px inherit;font-family:inherit;letter-spacing:1px;text-transform:uppercase;box-shadow:0 0 10px rgba(0,240,255,.5),inset 0 0 10px rgba(0,240,255,.2);text-shadow:0 0 6px var(--c)}
.nb.m{color:var(--m);border-color:var(--m);box-shadow:0 0 10px rgba(255,43,214,.5),inset 0 0 10px rgba(255,43,214,.2);text-shadow:0 0 6px var(--m)}
.nb:active{transform:scale(.97)}
.tools{display:flex;gap:10px;margin-top:12px}
.tools input,.tools select{flex:1;min-width:0;background:#000;color:var(--tx);border:1px solid #1d3a44;border-radius:12px;padding:10px 12px;font:15px inherit;font-family:inherit;outline:none}
.tools input:focus,.tools select:focus{border-color:var(--c);box-shadow:0 0 10px rgba(0,240,255,.4)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 18px 6px;scrollbar-width:none}
.chip{flex:none;background:#000;color:var(--mut);border:1px solid #1d3a44;border-radius:999px;padding:7px 14px;font:600 13px inherit;font-family:inherit}
.chip.on{color:var(--g);border-color:var(--g);box-shadow:0 0 10px rgba(182,255,0,.5),inset 0 0 8px rgba(182,255,0,.2);text-shadow:0 0 6px var(--g)}
.count{padding:8px 20px;color:var(--mut);font-size:12px;letter-spacing:1px;text-transform:uppercase}
ul{list-style:none;margin:0;padding:0 12px}
li{display:flex;align-items:center;gap:12px;padding:9px 8px;border-radius:16px;border:1px solid transparent}
li:active{background:#07131a}
li.cur{border-color:var(--m);box-shadow:0 0 12px rgba(255,43,214,.45),inset 0 0 12px rgba(255,43,214,.12)}
.cv{flex:none;background:#050d12 center/cover no-repeat;border:1px solid var(--c);box-shadow:0 0 8px rgba(0,240,255,.5);display:grid;place-items:center;overflow:hidden}
.cv.noart::after{content:"♪";color:var(--c);text-shadow:0 0 10px var(--c);font-size:1.4em}
li .cv{width:50px;height:50px;border-radius:12px}
li.cur .cv{border-color:var(--m);box-shadow:0 0 8px rgba(255,43,214,.7)}
.tt{min-width:0;flex:1}
.tt b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt span{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
li.cur .tt b{color:var(--m);text-shadow:0 0 8px var(--m)}
.empty{text-align:center;color:var(--mut);padding:70px 30px;line-height:1.6}
.empty .big{font-size:60px;color:var(--c);text-shadow:0 0 12px var(--c),0 0 30px var(--c)}
svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 5px currentColor)}
svg .f{fill:currentColor}
/* boutons ronds néon */
.ib{position:relative;width:52px;height:52px;border-radius:50%;background:#000;color:var(--c);border:1.5px solid var(--c);display:grid;place-items:center;box-shadow:0 0 10px rgba(0,240,255,.55),inset 0 0 10px rgba(0,240,255,.18);padding:0}
.ib:active{transform:scale(.92)}
.ib.pp{width:76px;height:76px;color:var(--m);border-color:var(--m);box-shadow:0 0 16px rgba(255,43,214,.7),inset 0 0 16px rgba(255,43,214,.25)}
.ib.pp svg{width:34px;height:34px}
.ib.t{width:46px;height:46px;color:var(--mut);border-color:#1d3a44;box-shadow:none}
.ib.t svg{filter:none}
.ib.t.on{color:var(--g);border-color:var(--g);box-shadow:0 0 12px rgba(182,255,0,.6),inset 0 0 10px rgba(182,255,0,.2)}
.ib.t.on svg{filter:drop-shadow(0 0 5px currentColor)}
.ib .bd{position:absolute;right:7px;top:6px;font:800 10px inherit;font-family:inherit}
/* mini player */
#mini{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));background:#04090c;border:1.5px solid var(--c);border-radius:20px;padding:8px 10px;display:flex;align-items:center;gap:10px;box-shadow:0 0 16px rgba(0,240,255,.5),inset 0 0 14px rgba(0,240,255,.12);z-index:5;overflow:hidden}
#mini .cv{width:46px;height:46px;border-radius:12px}
#mini .tt{cursor:pointer}
#mini .ib{width:44px;height:44px}
#mini .ib svg{width:20px;height:20px}
#mini .bar{position:absolute;left:0;bottom:0;height:3px;width:var(--p,0%);background:linear-gradient(90deg,var(--c),var(--m));box-shadow:0 0 8px var(--m)}
/* plein écran */
#full{position:fixed;inset:0;background:#000;z-index:10;display:none;flex-direction:column;align-items:center;padding:calc(14px + env(safe-area-inset-top,0px)) 24px calc(22px + env(safe-area-inset-bottom,0px));overflow:hidden}
#full.open{display:flex}
#full .bg{position:absolute;inset:-40px;background:center/cover;filter:blur(60px) saturate(1.6);opacity:.35;z-index:0}
#full>*{position:relative;z-index:1}
#full .top{width:100%;display:flex;justify-content:space-between;align-items:center;letter-spacing:3px;font-size:11px;color:var(--mut);text-transform:uppercase}
#full .art{flex:1;display:grid;place-items:center;width:100%;min-height:0}
#full .art .cv{width:min(80vw,44vh);height:min(80vw,44vh);border-radius:28px;border:2px solid var(--m);box-shadow:0 0 18px rgba(255,43,214,.75),0 0 60px rgba(255,43,214,.35),inset 0 0 20px rgba(255,43,214,.2);font-size:60px}
#full .meta{text-align:center;width:100%;margin:6px 0 10px}
#full .meta b{display:block;font-size:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--tx);text-shadow:0 0 10px rgba(0,240,255,.8)}
#full .meta span{font-size:14px;color:var(--c);opacity:.8}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;margin:0;outline:none}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:5px;background:linear-gradient(90deg,var(--c),var(--m)) 0/var(--p,0%) 100% no-repeat,#12262d}
input[type=range]::-moz-range-track{height:5px;border-radius:5px;background:#12262d}
input[type=range]::-moz-range-progress{height:5px;border-radius:5px;background:var(--c)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;margin-top:-6.5px;border-radius:50%;background:#fff;box-shadow:0 0 10px var(--m),0 0 20px var(--m)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border:0;border-radius:50%;background:#fff;box-shadow:0 0 10px var(--m)}
.time{width:100%;display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-top:2px}
.ctl{width:100%;display:flex;justify-content:space-between;align-items:center;margin-top:14px}
#qp{position:fixed;inset:0;background:#000;z-index:20;display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
#qp.open{display:flex}
.qtop{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;font-size:18px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--c);text-shadow:0 0 8px var(--c)}
.qtop .nb{flex:none;padding:9px 14px;font-size:12px}
#qList{flex:1;overflow-y:auto;padding:0 12px calc(24px + env(safe-area-inset-bottom,0px))}
.qh{padding:14px 8px 6px;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--g);text-shadow:0 0 6px var(--g)}
.add{flex:none;width:40px;height:40px}
.add svg{width:18px;height:18px}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:30;display:none;align-items:flex-end}
#sheet.open{display:flex}
.box{width:100%;background:#04090c;border:1.5px solid var(--c);border-bottom:0;border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;box-shadow:0 0 24px rgba(0,240,255,.45)}
.box .st{text-align:center;color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px}
.box .nb{flex:none}
.nb.x{color:var(--mut);border-color:#1d3a44;box-shadow:none;text-shadow:none}
#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:#000;color:var(--g);border:1.5px solid var(--g);border-radius:999px;padding:10px 18px;font-size:14px;box-shadow:0 0 14px rgba(182,255,0,.55);transition:.25s;z-index:40;white-space:nowrap}

<script>
const $=s=>document.querySelector(s), au=$('#au');
const S={tracks:[],folder:'all',sort:'new',q:'',shuffle:false,repeat:0,cur:null,hist:[],url:null,drag:false,queue:[],pn:0,shuf:null};
const EXT=/\.(mp3|m4a|aac|wav|flac|ogg|opus|aif|aiff|caf|mp4)$/i;
const fmt=s=>{if(!isFinite(s))return'0:00';s=Math.floor(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const ico=(el,n)=>el.querySelector('use').setAttribute('href','#i-'+n);
const setCv=(el,t)=>{
  if(t&&t.art){el.style.backgroundImage='url("'+t.art+'")';el.classList.remove('noart')}
  else{el.style.backgroundImage='';el.classList.add('noart')}
};
const title=t=>t.title||t.name, sub=t=>t.artist||t.folder;
const info=t=>[t.file.name.split('.').pop().toUpperCase(),t.kbps?t.kbps+' kbps':''].filter(Boolean).join(' · ');

function addFiles(files){
  const keys=new Set(S.tracks.map(t=>t.key)), fresh=[];
  for(const f of files){
    if(!(f.type.startsWith('audio')||EXT.test(f.name)))continue;
    const key=f.name+f.size+f.lastModified; if(keys.has(key))continue; keys.add(key);
    const parts=(f.webkitRelativePath||'').split('/');
    const t={key,file:f,name:f.name.replace(/\.[^.]+$/,''),folder:parts.length>1?parts[parts.length-2]:'Fichiers',mtime:f.lastModified,title:'',artist:'',art:''};
    S.tracks.push(t);fresh.push(t);save(t);
  }
  render();processQ(fresh);
}
let busy=false;const pend=[];
function probe(t){return new Promise(res=>{
  const a=new Audio(),u=URL.createObjectURL(t.file);a.preload='metadata';
  let to;const done=()=>{clearTimeout(to);a.onloadedmetadata=a.onerror=null;URL.revokeObjectURL(u);res()};
  to=setTimeout(done,6000);
  a.onloadedmetadata=()=>{if(isFinite(a.duration)&&a.duration>0)t.kbps=Math.round(t.file.size*8/a.duration/1000);done()};
  a.onerror=done;a.src=u;
})}
async function processQ(list){
  pend.push(...list);if(busy)return;busy=true;
  let tick;const bump=()=>{clearTimeout(tick);tick=setTimeout(()=>{render();if(S.cur)ui()},250)};
  while(pend.length){
    const t=pend.shift();
    if(!t.tagged&&window.jsmediatags){
      await new Promise(res=>{try{jsmediatags.read(t.file,{onSuccess:({tags})=>{
        if(tags.title)t.title=tags.title;if(tags.artist)t.artist=tags.artist;
        const p=tags.picture;
        if(p&&p.data){t.artBlob=new Blob([new Uint8Array(p.data)],{type:p.format||'image/jpeg'});t.art=URL.createObjectURL(t.artBlob)}
        res()},onError:res})}catch(e){res()}});
      t.tagged=true;
    }
    if(!t.kbps)await probe(t);
    save(t);bump();
  }
  busy=false;
}
function view(){
  const q=S.q;
  const l=S.tracks.filter(t=>(S.folder==='all'||t.folder===S.folder)&&(title(t)+' '+t.artist).toLowerCase().includes(q));
  const c={new:(a,b)=>b.mtime-a.mtime,old:(a,b)=>a.mtime-b.mtime,az:(a,b)=>title(a).localeCompare(title(b)),za:(a,b)=>title(b).localeCompare(title(a))}[S.sort];
  return l.sort(c);
}
function render(){
  const folders=[...new Set(S.tracks.map(t=>t.folder))].sort();
  const ch=$('#chips');ch.innerHTML='';
  if(folders.length>1)['all',...folders].forEach(f=>{
    const b=document.createElement('button');b.className='chip'+(S.folder===f?' on':'');
    b.textContent=f==='all'?'Tout':f;b.onclick=()=>{S.folder=f;render()};ch.appendChild(b);
  });
  const l=view();
  $('#empty').style.display=S.tracks.length?'none':'block';$('#clearAll').style.display=S.tracks.length?'':'none';
  $('#count').textContent=S.tracks.length?l.length+' piste'+(l.length>1?'s':''):'';
  const ul=$('#list');ul.innerHTML='';
  l.forEach(t=>{
    const li=document.createElement('li');if(t===S.cur)li.className='cur';
    li.innerHTML='<div class="cv noart"></div><div class="tt"><b></b><span></span></div>';
    setCv(li.querySelector('.cv'),t);
    li.querySelector('b').textContent=title(t);
    li.querySelector('span').textContent=sub(t)+' · '+new Date(t.mtime).toLocaleDateString('fr-FR');
    if(t.kbps){const br=document.createElement('div');br.className='br';br.textContent=t.kbps+' kbps';li.appendChild(br)}
    const ab=document.createElement('button');ab.className='ib t add';ab.innerHTML='<svg><use href="#i-plus"/></svg>';ab.onclick=e=>{e.stopPropagation();openSheet(t)};li.appendChild(ab);
    li.onclick=()=>{S.hist=[];S.shuf=null;play(t)};
    ul.appendChild(li);
  });
}
function ui(){
  const t=S.cur;if(!t)return;
  $('#mini').style.display='flex';
  $('#mT').textContent=$('#fT').textContent=title(t);
  $('#mS').textContent=$('#fS').textContent=sub(t);
  setCv($('#mCv'),t);setCv($('#fCv'),t);$('#fB').textContent=info(t);
  $('#fBg').style.backgroundImage=t.art?'url("'+t.art+'")':'none';
  if('mediaSession'in navigator){
    const md={title:title(t),artist:sub(t)};if(t.art)md.artwork=[{src:t.art,sizes:'512x512'}];
    navigator.mediaSession.metadata=new MediaMetadata(md);
  }
}
function play(t){
  if(S.url)URL.revokeObjectURL(S.url);
  S.url=URL.createObjectURL(t.file);S.cur=t;au.src=S.url;au.play().catch(()=>{});
  ui();render();refQ();
}
function shuffled(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function autoList(){
  const l=view();
  if(S.shuffle){
    if(S.shuf)S.shuf=S.shuf.filter(x=>x!==S.cur&&l.includes(x));
    if(!S.shuf||!S.shuf.length)S.shuf=shuffled(l.filter(x=>x!==S.cur));
    return S.shuf;
  }
  return l.slice(l.indexOf(S.cur)+1);
}
function popQ(){const t=S.queue.shift();if(S.pn>0)S.pn--;return t}
function next(auto){
  if(auto&&S.repeat===2){au.currentTime=0;au.play();return}
  if(S.queue.length){if(S.cur)S.hist.push(S.cur);return play(popQ())}
  const a=autoList();
  if(a.length){if(S.cur)S.hist.push(S.cur);return play(a[0])}
  const l=view();if(!l.length)return;
  if(auto&&S.repeat===0){au.pause();return}
  S.shuf=null;play(l[0]);
}
function prev(){
  if(au.currentTime>3||!S.cur){au.currentTime=0;return}
  if(S.hist.length)return play(S.hist.pop());
  const l=view(),i=l.indexOf(S.cur);if(l.length)play(l[(i-1+l.length)%l.length]);
}
function toggle(){if(!S.cur){const l=view();if(l.length)play(l[0]);return}au.paused?au.play():au.pause()}

$('#bFiles').onclick=()=>$('#fFiles').click();
$('#bDir').onclick=()=>$('#fDir').click();
$('#fFiles').onchange=e=>{addFiles(e.target.files);e.target.value=''};
$('#fDir').onchange=e=>{addFiles(e.target.files);e.target.value=''};
$('#q').oninput=e=>{S.q=e.target.value.toLowerCase();render()};
$('#sort').onchange=e=>{S.sort=e.target.value;render()};
$('#bPlay').onclick=$('#mPlay').onclick=toggle;
$('#bNext').onclick=$('#mNext').onclick=()=>next(false);
$('#bPrev').onclick=$('#mPrev').onclick=prev;
$('#mOpen').onclick=$('#mCv').onclick=()=>$('#full').classList.add('open');
$('#fClose').onclick=()=>$('#full').classList.remove('open');
$('#bSh').onclick=e=>{S.shuffle=!S.shuffle;S.shuf=null;refQ();e.currentTarget.classList.toggle('on',S.shuffle)};
$('#bRep').onclick=e=>{
  S.repeat=(S.repeat+1)%3;e.currentTarget.classList.toggle('on',S.repeat>0);
  $('#bd').textContent=S.repeat===2?'1':'';
};
const sk=$('#seek');
const setP=p=>{sk.style.setProperty('--p',p+'%');$('#mini').style.setProperty('--p',p+'%')};
sk.oninput=()=>{S.drag=true;setP(sk.value/10);$('#tc').textContent=fmt(sk.value/1000*au.duration)};
sk.onchange=()=>{if(isFinite(au.duration))au.currentTime=sk.value/1000*au.duration;S.drag=false};
au.ontimeupdate=()=>{
  $('#td').textContent=fmt(au.duration);
  if(!S.drag&&au.duration){const p=au.currentTime/au.duration*100;$('#tc').textContent=fmt(au.currentTime);sk.value=p*10;setP(p)}
};
au.onplay=()=>{ico($('#bPlay'),'pause');ico($('#mPlay'),'pause');setMS()};
au.onpause=()=>{ico($('#bPlay'),'play');ico($('#mPlay'),'play')};
au.onended=()=>next(true);
function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1700)}
let shT=null;
function openSheet(t){shT=t;$('#shT').textContent=title(t);$('#sheet').classList.add('open')}
function closeSheet(){$('#sheet').classList.remove('open')}
$('#shBox').onclick=e=>e.stopPropagation();
$('#sheet').onclick=$('#shCancel').onclick=closeSheet;
$('#shNext').onclick=()=>{S.queue.splice(S.pn,0,shT);S.pn++;closeSheet();toast('Sera lu juste après');refQ()};
$('#shEnd').onclick=()=>{S.queue.push(shT);closeSheet();toast('Ajouté à la file d’attente');refQ()};
function qRow(t,o){
  const li=document.createElement('li');
  li.innerHTML='<div class="cv noart"></div><div class="tt"><b></b><span></span></div>';
  setCv(li.querySelector('.cv'),t);
  li.querySelector('b').textContent=title(t);
  li.querySelector('span').textContent=sub(t);
  li.onclick=o.go;
  if(o.rm){const b=document.createElement('button');b.className='ib t add';b.innerHTML='<svg><use href="#i-x"/></svg>';b.onclick=e=>{e.stopPropagation();o.rm()};li.appendChild(b)}
  return li;
}
function renderQ(){
  const ul=$('#qList');ul.innerHTML='';
  const hd=s=>{const h=document.createElement('div');h.className='qh';h.textContent=s;ul.appendChild(h)};
  if(S.cur){hd('En cours');const li=qRow(S.cur,{go:()=>{}});li.classList.add('cur');ul.appendChild(li)}
  if(S.queue.length){
    hd('File d’attente ('+S.queue.length+')');
    S.queue.forEach((t,i)=>ul.appendChild(qRow(t,{
      go:()=>{S.queue.splice(i,1);if(i<S.pn)S.pn--;if(S.cur)S.hist.push(S.cur);play(t)},
      rm:()=>{S.queue.splice(i,1);if(i<S.pn)S.pn--;refQ()}})));
  }
  const a=autoList().slice(0,60);
  if(a.length){hd(S.shuffle?'Ensuite (aléatoire)':'Ensuite');a.forEach(t=>ul.appendChild(qRow(t,{go:()=>{if(S.cur)S.hist.push(S.cur);play(t)}})))}
  if(!S.cur&&!S.queue.length&&!a.length){const e=document.createElement('div');e.className='empty';e.textContent='Rien à suivre pour le moment.';ul.appendChild(e)}
}
function refQ(){$('#qBd').textContent=S.queue.length||'';if($('#qp').classList.contains('open'))renderQ()}
$('#fQ').onclick=()=>{renderQ();$('#qp').classList.add('open')};
$('#qClose').onclick=()=>$('#qp').classList.remove('open');
$('#qClear').onclick=()=>{S.queue=[];S.pn=0;refQ()};

function setMS(){
  if(!('mediaSession'in navigator))return;
  const m=navigator.mediaSession,h=(a,f)=>{try{m.setActionHandler(a,f)}catch(e){}};
  h('play',()=>au.play());h('pause',()=>au.pause());
  h('nexttrack',()=>next(false));h('previoustrack',prev);
  h('seekbackward',null);h('seekforward',null);
}
setMS();
let DB=null;
const dbp=new Promise(res=>{try{const r=indexedDB.open('trx',1);r.onupgradeneeded=()=>r.result.createObjectStore('tracks',{keyPath:'key'});r.onsuccess=()=>{DB=r.result;res(DB)};r.onerror=r.onblocked=()=>res(null)}catch(e){res(null)}});
async function tx(mode,fn){
  const d=await dbp;if(!d)return null;
  return new Promise(res=>{try{const t=d.transaction('tracks',mode),q=fn(t.objectStore('tracks'));t.oncomplete=()=>res(q&&q.result!==undefined?q.result:true);t.onerror=t.onabort=()=>res(null)}catch(e){res(null)}});
}
function save(t){return tx('readwrite',s=>s.put({key:t.key,file:t.file,name:t.name,folder:t.folder,mtime:t.mtime,title:t.title,artist:t.artist,artBlob:t.artBlob||null,kbps:t.kbps||0,tagged:!!t.tagged}))}
$('#shDel').onclick=()=>{const t=shT;closeSheet();S.tracks=S.tracks.filter(x=>x!==t);S.queue=S.queue.filter(x=>x!==t);S.pn=Math.min(S.pn,S.queue.length);tx('readwrite',s=>s.delete(t.key));toast('Retiré de la bibliothèque');render();refQ()};
$('#clearAll').onclick=()=>{if(!confirm('Supprimer toute la bibliothèque enregistrée dans l’app ?'))return;au.pause();S.tracks=[];S.queue=[];S.pn=0;S.cur=null;S.hist=[];tx('readwrite',s=>s.clear());$('#mini').style.display='none';$('#full').classList.remove('open');render();refQ()};
au.onloadedmetadata=()=>{const t=S.cur;if(t&&!t.kbps&&au.duration>0){t.kbps=Math.round(t.file.size*8/au.duration/1000);save(t);ui();render()}};
(async()=>{
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  const rec=await tx('readonly',s=>s.getAll());
  if(Array.isArray(rec)&&rec.length){
    const keys=new Set(S.tracks.map(t=>t.key));
    rec.forEach(r=>{if(!keys.has(r.key))S.tracks.push({...r,art:r.artBlob?URL.createObjectURL(r.artBlob):''})});
    render();processQ(S.tracks.filter(t=>!t.tagged||!t.kbps));
  }
})();
render();
</script>
</body>
</html>
